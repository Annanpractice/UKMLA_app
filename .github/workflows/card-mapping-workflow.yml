name: Validate AI-led card mapping interface

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate card peek and old-loader removal
        run: |
          node --check v2/question-card-peek.js
          node --check v2/ai-jarvis-legacy-capture.js
          node --check v2/question-bank.js
          if grep -q "load('./v2/question-card-mapper.js'" v2/ai-jarvis-legacy-capture.js; then
            echo "Retired manual mapper still injects at boot" >&2
            exit 1
          fi
          grep -q "missingCardExplanation" v2/question-card-peek.js
          grep -q "suggestedCardTitles" v2/question-card-peek.js
          grep -q "ukmlaQuestionMappingUpdated" v2/question-card-peek.js
          grep -q 'data-bank-map' v2/question-bank.js
          grep -q 'id="bank-prev"' v2/question-bank.js
          grep -q 'id="bank-next"' v2/question-bank.js
