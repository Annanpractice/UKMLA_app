name: Validate and deploy UKMLA Cards

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript and Python syntax
        id: syntax
        shell: bash
        run: |
          set +e
          : > validation-diagnostics.txt
          STATUS=0

          for FILE in \
            v2/core.js \
            v2/large-storage.js \
            v2/question-bank.js \
            v2/question-analytics.js \
            v2/ai-transport.js \
            v2/ai-schema.js \
            v2/biomedical-ai.js \
            v2/ai-giveaway-validator.js \
            v2/ai-pipeline-mode.js \
            v2/ai-sba-audit.js \
            v2/ai-targeted-repair.js \
            v2/ai-engine.js \
            v2/ai-ui.js \
            v2/biomedical.js \
            v2/biomedical-basic.js \
            v2/question-workspace.js \
            v2/knowledge-pptx.js \
            v2/knowledge.js \
            v2/firebase-config.js \
            v2/sync.js \
            v2/psa-schema.js \
            v2/psa-engine.js \
            v2/psa-grounding.js \
            v2/psa-runtime.js \
            v2/psa.js \
            v2/handsfree.js \
            service-worker.js \
            scripts/validate_psa_module.js \
            scripts/validate_question_concision.js \
            scripts/validate_combined_pipeline.js \
            scripts/validate_question_bank.js \
            scripts/validate_checkpoint_auto_repair.js
          do
            echo "=== ${FILE} ===" >> validation-diagnostics.txt
            node --check "${FILE}" >> validation-diagnostics.txt 2>&1
            CODE=$?
            if [ ${CODE} -ne 0 ]; then STATUS=${CODE}; fi
          done

          for FILE in \
            scripts/build_v2_data.py \
            scripts/biomedical_core.py \
            scripts/normalise_v2_data.py \
            scripts/validate_biomedical_module.py
          do
            echo "=== ${FILE} ===" >> validation-diagnostics.txt
            python -m py_compile "${FILE}" >> validation-diagnostics.txt 2>&1
            CODE=$?
            if [ ${CODE} -ne 0 ]; then STATUS=${CODE}; fi
          done

          cat validation-diagnostics.txt
          exit ${STATUS}

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: validation-diagnostics.txt
          if-no-files-found: error

      - name: Validate PSA blueprint, source grounding and calculations
        run: node scripts/validate_psa_module.js

      - name: Validate sparse stems and concise answer checkpoints
        run: node scripts/validate_question_concision.js

      - name: Validate combined pipeline, SBA audit and immediate rollback
        run: node scripts/validate_combined_pipeline.js

      - name: Validate targeted checkpoint API repair
        run: node scripts/validate_checkpoint_auto_repair.js

      - name: Validate IndexedDB Question Bank, quota rollback and analytics
        run: node scripts/validate_question_bank.js

      - name: Validate biomedical and curated clinical generated data
        run: python scripts/validate_biomedical_module.py

      - name: Validate Basic HTML profile isolation
        run: |
          grep -q "\['anatomy','physiology'\].includes(item.profile)" v2/biomedical-basic.js
          grep -q "questions.length!==10" v2/biomedical-basic.js
          grep -q "UKMLA_QUESTION_BANK.*storeSet" v2/biomedical-basic.js
          grep -q "biomedical-basic.js" v2/app.html

      - name: Validate question workspace integration
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path('v2/question-workspace.js').read_text(encoding='utf-8')
          ai_ui = Path('v2/ai-ui.js').read_text(encoding='utf-8')
          pipeline = Path('v2/ai-pipeline-mode.js').read_text(encoding='utf-8')
          audit = Path('v2/ai-sba-audit.js').read_text(encoding='utf-8')
          repair = Path('v2/ai-targeted-repair.js').read_text(encoding='utf-8')
          engine = Path('v2/ai-engine.js').read_text(encoding='utf-8')
          sync = Path('v2/sync.js').read_text(encoding='utf-8')
          large = Path('v2/large-storage.js').read_text(encoding='utf-8')
          bank = Path('v2/question-bank.js').read_text(encoding='utf-8')
          html = Path('v2/app.html').read_text(encoding='utf-8')

          for marker in [
              "ai:'UKMLA Questions'", "bank:'Question Bank'",
              'window.UKMLA_V2_AI.mount(container)', 'UKMLA_QUESTION_BANK.mount(container)',
              'api.App.state.quizTab=tab', 'GMC content-map practice', 'BNF/NICE-grounded'
          ]:
              assert marker in workspace, marker

          for marker in ['Temporary OpenAI API key', 'inputmode="text"', 'Session only', 'Build 10 UKMLA questions', 'id="ai-pipeline-mode"']:
              assert marker in ai_ui, marker
          assert 'AI-generated UKMLA quiz' not in ai_ui
          assert 'Generate 10-question AI quiz' not in ai_ui

          for marker in ['Faster combined review (trial)', 'Legacy separate reviews', 'OPTION NORMALISATION']:
              assert marker in pipeline, marker
          for marker in ['ANSWER-CATEGORY ALIGNMENT', 'OPTIONS MUST BE ANSWER LABELS', 'At least three of the four wrong options']:
              assert marker in audit, marker
          for marker in ['Return only atomic text patches', 'Affected-question repair', 'Full-set fallback repair']:
              assert marker in repair, marker
          for marker in ['assertRequiredApiCheckpoints', 'apiSuccessByStage', 'targeted field, affected-question and full-set repair']:
              assert marker in engine, marker
          assert 'ukmla-v2-backup-4-indexeddb' in sync
          assert 'No partial import was kept' in large
          assert "storageBackend:'indexeddb'" in bank

          order = [
              './v2/large-storage.js', './v2/question-bank.js', './v2/biomedical-ai.js',
              './v2/ai-giveaway-validator.js', './v2/ai-pipeline-mode.js', './v2/ai-sba-audit.js',
              './v2/ai-targeted-repair.js', './v2/ai-engine.js', './v2/biomedical-basic.js',
              './v2/question-workspace.js'
          ]
          positions = [html.index(item) for item in order]
          assert positions == sorted(positions)
          for marker in ['question-workspace.css', 'question-bank.css', 'question-analytics.js', 'sync.js', "updateViaCache:'none'"]:
              assert marker in html, marker
          PY

      - name: Audit complete card dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/conditions.json').read_text(encoding='utf-8'))
          conditions = data['conditions']
          ids = [item['id'] for item in conditions]
          topics = {item['name']: item['count'] for item in data['topics']}
          profiles = {}
          for item in conditions:
              profiles[item['profile']] = profiles.get(item['profile'], 0) + 1

          print(f"Extracted cards: {data['conditionCount']}")
          print(f"Extracted topics: {data['topicCount']}")
          print(f"Profiles: {profiles}")

          assert data['conditionCount'] == 841
          assert data['topicCount'] == 25
          assert len(conditions) == data['conditionCount']
          assert len(ids) == len(set(ids))
          assert profiles == {
              'anatomy': 139,
              'clinical': 418,
              'law': 69,
              'physiology': 215,
          }
          assert topics['Clinical Anatomy'] == 139
          assert topics['Clinical Physiology'] == 215
          assert all(item.get('id') and item.get('topicId') and item.get('name') for item in conditions)
          assert all(len(item.get('fields', {})) >= 3 for item in conditions)
          assert all(len(item['fields']) == 5 for item in conditions if item['profile'] in {'anatomy', 'physiology'})
          assert not any(name.lower().endswith(' heading') for name in topics)
          PY

      - name: Upload extracted card dataset
        uses: actions/upload-artifact@v4
        with:
          name: extracted-card-data
          path: data/conditions.json
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract complete condition dataset
        run: |
          python scripts/build_v2_data.py
          python scripts/normalise_v2_data.py

      - name: Prepare lightweight routed app
        run: |
          rm -rf _site
          mkdir -p _site/v2 _site/data _site/assets
          cp v2/app.html _site/index.html
          cp v2/*.css v2/*.js _site/v2/
          cp data/conditions.json _site/data/conditions.json
          cp assets/ukmla-intro.mp4 _site/assets/ukmla-intro.mp4
          cp assets/ukmla-intro-first-frame.jpg _site/assets/ukmla-intro-first-frame.jpg
          cp service-worker.js _site/service-worker.js

          cat > _site/app.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Opening UKMLA Cards</title>
          <script>location.replace('./#/home');</script>
          <p><a href="./#/home">Open UKMLA Cards</a></p>
          HTML

          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              '_site/index.html', '_site/service-worker.js', '_site/data/conditions.json',
              '_site/assets/ukmla-intro.mp4', '_site/assets/ukmla-intro-first-frame.jpg',
              '_site/v2/core.js', '_site/v2/large-storage.js', '_site/v2/question-bank.js',
              '_site/v2/question-analytics.js', '_site/v2/ai-schema.js', '_site/v2/ai-engine.js',
              '_site/v2/ai-ui.js', '_site/v2/biomedical.js', '_site/v2/biomedical-basic.js',
              '_site/v2/question-workspace.js', '_site/v2/psa.js', '_site/v2/psa-grounding.js'
          ]
          for name in required:
              path = Path(name)
              assert path.exists() and path.stat().st_size > 0, name

          data = json.loads(Path('_site/data/conditions.json').read_text(encoding='utf-8'))
          assert data['conditionCount'] == 841
          assert data['topicCount'] == 25
          names = {item['name'] for item in data['conditions']}
          assert 'Polyendocrine metabolic ovarian syndrome (PMOS; formerly PCOS)' in names
          assert 'Severe androgen excess / postmenopausal hyperandrogenism' in names
          assert 'Polycystic ovary syndrome' not in names

          html = Path('_site/index.html').read_text(encoding='utf-8')
          assert 'original-pdf-data' not in html
          assert '<iframe' not in html
          assert 'service-worker.js' in html
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
