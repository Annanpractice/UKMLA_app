name: Android offline reader
on:
  push:
    branches: [codex/offline-ukmla-reader]
    paths: ['android-reader/**', '.github/workflows/android-offline-reader.yml']
  pull_request:
    branches: [main]
    paths: ['android-reader/**', '.github/workflows/android-offline-reader.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: offline-reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare SDK and pinned inference runtime
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          mkdir -p android-reader/vendor/llama.cpp
          curl --fail --retry 3 -L https://github.com/ggml-org/llama.cpp/archive/ec91ab5add06555970f98d9c5361d884f3f530f8.tar.gz | tar xz --strip-components=1 -C android-reader/vendor/llama.cpp
          base64 -d android-reader/preview.keystore.b64 > android-reader/preview.keystore
      - name: Build local card database
        run: |
          python scripts/build_v2_data.py
          python scripts/normalise_v2_data.py
          python android-reader/tools/build_database.py
      - name: Test and assemble APK
        working-directory: android-reader
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify offline APK
        run: |
          APK=android-reader/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/permissions.txt
          if grep -q android.permission.INTERNET /tmp/permissions.txt; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libreader.so'
          unzip -l "$APK" | grep 'assets/reader.db'
          cp "$APK" UKMLA-Offline-Reader-v0.1.5-arm64.apk
          sha256sum UKMLA-Offline-Reader-v0.1.5-arm64.apk > SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android offline smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: cd android-reader && gradle --no-daemon -PreaderAbi=x86_64 :app:connectedDebugAndroidTest
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=offline-reader-v0.1.5
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'UKMLA Offline Reader 0.1.5 (Android preview)' --notes-file android-reader/RELEASE.md
          fi
          gh release upload "$TAG" UKMLA-Offline-Reader-v0.1.5-arm64.apk SHA256SUMS.txt --clobber
