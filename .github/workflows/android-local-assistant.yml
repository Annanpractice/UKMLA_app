name: Android Local Qwen Assistant
on:
  push:
    branches: [codex/local-qwen-assistant]
    paths: ['android-assistant/**', '.github/workflows/android-local-assistant.yml']
  pull_request:
    branches: [main]
    paths: ['android-assistant/**', '.github/workflows/android-local-assistant.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: local-qwen-assistant-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare SDK and pinned llama.cpp
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          mkdir -p android-assistant/vendor/llama.cpp
          curl --fail --retry 3 -L https://github.com/ggml-org/llama.cpp/archive/ec91ab5add06555970f98d9c5361d884f3f530f8.tar.gz | tar xz --strip-components=1 -C android-assistant/vendor/llama.cpp
          base64 -d android-reader/preview.keystore.b64 > android-assistant/preview.keystore
      - name: Test and assemble APK
        working-directory: android-assistant
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify offline APK
        run: |
          APK=android-assistant/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/qwen-permissions.txt
          if grep -q android.permission.INTERNET /tmp/qwen-permissions.txt; then exit 1; fi
          grep -q android.permission.FOREGROUND_SERVICE /tmp/qwen-permissions.txt
          grep -q android.permission.FOREGROUND_SERVICE_SPECIAL_USE /tmp/qwen-permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libassistant.so'
          cp "$APK" Local-Qwen-Assistant-v0.1.1-arm64.apk
          sha256sum Local-Qwen-Assistant-v0.1.1-arm64.apk > LOCAL-QWEN-SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android assistant smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: cd android-assistant && gradle --no-daemon -PassistantAbi=x86_64 :app:connectedDebugAndroidTest
      - name: Publish downloadable preview
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=local-qwen-assistant-v0.1.1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'Local Qwen Assistant 0.1.1 (Android preview)' --notes-file android-assistant/RELEASE.md
          fi
          gh release upload "$TAG" Local-Qwen-Assistant-v0.1.1-arm64.apk LOCAL-QWEN-SHA256SUMS.txt --clobber
