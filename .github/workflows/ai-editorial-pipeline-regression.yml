name: AI editorial pipeline regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate bounded editorial question workflow
        run: node scripts/test-ai-editorial-pipeline.mjs
