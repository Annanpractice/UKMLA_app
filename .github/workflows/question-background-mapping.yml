name: Validate Luna retrospective question mapping

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate mapping, importer and player syntax
        run: |
          node --check v2/question-mapping-background.js
          node --check v2/question-importer-v2.js
          node --check v2/question-importer-progress.js
          node --check v2/question-bank.js
          node --check v2/question-card-peek.js

      - name: Exercise Luna mapping checkpoint and decision contract
        run: node --test scripts/test-luna-retrospective-mapping.mjs

      - name: Verify AI-only mapping controls and offline assets
        run: |
          grep -q "Map Questions" v2/question-bank.js
          grep -q "importedMappingStatus:'pending'" v2/question-importer-v2.js
          grep -q "question-mapping-background.js?v=2" v2/app.html
          grep -q "question-importer-v2.js?v=2" v2/app.html
          grep -q "ukmla-cards-v64-luna-import-retrospective-mapping" service-worker.js
          grep -q "question-card-peek.js" service-worker.js
          if grep -q 'question-learning-export.js' v2/app.html; then
            echo "Legacy recommendation approval controls are still loaded" >&2
            exit 1
          fi
