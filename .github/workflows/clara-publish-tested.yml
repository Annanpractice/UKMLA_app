name: Publish verified Clara 2.1 APKs
on:
  push:
    branches: [codex/pocketgemma-apk]
    paths: ['.github/workflows/clara-publish-tested.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the existing APKs passed build, signing and Android UI checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Annanpractice/UKMLA_app/actions/runs/40140931607 > tested-run.json
          gh api repos/Annanpractice/UKMLA_app/actions/runs/40140931607/jobs > tested-jobs.json
          python3 - <<'PY'
          import json
          run=json.load(open('tested-run.json'))
          assert run['head_sha']=='fc14ae7a766c3ad910c4c6d1175c1a195662723f'
          steps={s['name']:s['conclusion'] for j in json.load(open('tested-jobs.json'))['jobs'] for s in j['steps']}
          for name in ['Test speech chunking','Build Clara and Clara Study','Verify and name APKs','Verify study interactions and capture Android screens']:
              assert steps.get(name)=='success', (name,steps.get(name))
          print('Existing APKs passed unit tests, signing verification and Android interaction checks.')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Annanpractice/UKMLA_app
          run-id: 40140931607
          pattern: Clara-v2.1.0-*
          merge-multiple: true
          path: release-apks
      - name: Publish the verified APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="clara-study-v2.1.0"
          cat > release-notes.md <<'NOTES'
          Native study redesign with graphite surfaces, mint and violet accents, readable cards and visible read-aloud. Includes an in-study conversation panel, microphone replies with partial transcripts, animated streaming bubbles, speech highlighting, reading-speed controls, stop controls and card-grounded tutor actions.

          Uses the same package IDs and pinned development signing certificate as v2.0.8. Imported decks, study progress, model files and voice preferences retain their existing storage. Development build using the existing public test-only signing identity. Unit tests, APK signing checks and Android interaction tests passed before publication. The target phone's Gemma runtime and installed voice/recognition services still require an on-device check.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-apks/Clara-v2.1.0.apk release-apks/Clara-v2.1.0-Study.apk release-apks/Clara-v2.1.0-Cards.apk --clobber
          else
            gh release create "$tag" release-apks/Clara-v2.1.0.apk release-apks/Clara-v2.1.0-Study.apk release-apks/Clara-v2.1.0-Cards.apk --target fc14ae7a766c3ad910c4c6d1175c1a195662723f --title "Clara v2.1.0 — redesigned study and voice tutor" --notes-file release-notes.md
          fi
