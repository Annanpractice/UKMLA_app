name: Clara Android APK
on:
  push:
    branches: [codex/pocketgemma-apk]
    paths:
      - 'pocket-gemma/**'
      - '.github/workflows/pocketgemma-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clara-android-branch
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # PUBLIC TEST-ONLY signing identity, NOT suitable for private production
      # keys. The Android Gradle signingConfig refers to this EXPLICIT path;
      # merely writing ~/.android/debug.keystore did not work across runners.
      - name: Restore and pin the experimental signing certificate
        run: |
          set -euo pipefail
          base64 --decode pocket-gemma/ci/study-debug.keystore.b64 > pocket-gemma/clara-fixed-debug.keystore
          chmod 600 pocket-gemma/clara-fixed-debug.keystore
          expected="c369f589532770ecca786978eb506e0d95400f26a77b6e6fc82cbcc377dd7579"
          actual="$(keytool -list -v -keystore pocket-gemma/clara-fixed-debug.keystore             -storepass android -alias androiddebugkey | awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signing key changed or failed to load. Refusing to build incompatible updates."
            exit 1
          fi
          echo "Pinned Clara test signing certificate verified."

      - name: Test speech chunking
        working-directory: pocket-gemma
        run: gradle :app:testCardsDebugUnitTest --no-daemon

      - name: Build Clara and Clara Study
        working-directory: pocket-gemma
        run: gradle :app:assembleRegularDebug :app:assembleStudyDebug :app:assembleCardsDebug :app:assembleCardsDebugAndroidTest --no-daemon

      - name: Verify and name APKs
        run: |
          set -euo pipefail
          cp pocket-gemma/app/build/outputs/apk/regular/debug/app-regular-debug.apk Clara-v2.1.0.apk
          cp pocket-gemma/app/build/outputs/apk/study/debug/app-study-debug.apk Clara-v2.1.0-Study.apk
          cp pocket-gemma/app/build/outputs/apk/cards/debug/app-cards-debug.apk Clara-v2.1.0-Cards.apk
          for apk in Clara-v2.1.0.apk Clara-v2.1.0-Study.apk Clara-v2.1.0-Cards.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          done
          regular=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs Clara-v2.1.0.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF; exit}')
          study=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs Clara-v2.1.0-Study.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF; exit}')
          cards=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs Clara-v2.1.0-Cards.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF; exit}')
          expected="c369f589532770ecca786978eb506e0d95400f26a77b6e6fc82cbcc377dd7579"
          for actual in "$regular" "$study" "$cards"; do
            if [ "$actual" != "$expected" ]; then
              echo "::error::APK is signed with an incorrect or newly generated certificate."
              exit 1
            fi
          done
          echo "All three APKs are verified against the pinned development certificate."

      - uses: actions/upload-artifact@v4
        with:
          name: Clara-v2.1.0-debug-apk
          path: Clara-v2.1.0.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Clara-v2.1.0-Study-installable-apk
          path: Clara-v2.1.0-Study.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Clara-v2.1.0-Cards-separate-install-apk
          path: Clara-v2.1.0-Cards.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify study interactions and capture Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle -p pocket-gemma :app:connectedCardsDebugAndroidTest --no-daemon
            mkdir -p pocket-gemma/ui-review
            adb pull /data/local/tmp/clara-ui-review/. pocket-gemma/ui-review/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Clara-v2.1.0-Android-review
          path: |
            pocket-gemma/ui-review/
            pocket-gemma/app/build/reports/androidTests/
            pocket-gemma/app/build/reports/tests/

      # Publish a direct phone-friendly APK link on success, automatically.
      - name: Publish direct download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="clara-study-v2.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Clara-v2.1.0.apk Clara-v2.1.0-Study.apk Clara-v2.1.0-Cards.apk --clobber
          else
            gh release create "$tag" Clara-v2.1.0.apk Clara-v2.1.0-Study.apk Clara-v2.1.0-Cards.apk \
              --target "$GITHUB_SHA" \
              --title "Clara v2.1.0 — redesigned study and voice tutor" \
              --notes "Redesigned native study screen with graphite surfaces, mint and violet accents, readable scrolling cards, visible read-aloud and an in-study Clara conversation panel. Includes microphone replies, streaming bubbles, speech highlighting, reading-speed controls and stop controls. Retains imported decks, progress, model storage, package IDs and the pinned development certificate from v2.0.8. Development build using the existing public test-only signing identity."
