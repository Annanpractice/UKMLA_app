name: Pocket Gemma Android APK
on:
  push:
    branches: [codex/pocketgemma-apk]
    paths:
      - 'pocket-gemma/**'
      - '.github/workflows/pocketgemma-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: pocket-gemma
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-gemma-v1.7-debug-apk
          path: pocket-gemma/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
