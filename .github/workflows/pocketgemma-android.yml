name: Clara Android APK
on:
  push:
    branches: [codex/pocketgemma-apk]
    paths:
      - 'pocket-gemma/**'
      - '.github/workflows/pocketgemma-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build Clara
        working-directory: pocket-gemma
        run: gradle :app:assembleDebug --no-daemon
      - name: Name the APK
        run: cp pocket-gemma/app/build/outputs/apk/debug/app-debug.apk Clara-v1.8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Clara-v1.8-debug-apk
          path: Clara-v1.8.apk
          if-no-files-found: error
          retention-days: 14
