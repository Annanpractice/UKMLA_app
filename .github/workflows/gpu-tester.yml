name: GPU tester APK
on:
  push:
    branches: [codex/gpu-tester]
    paths: ['gpu-tester/**', '.github/workflows/gpu-tester.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gpu-tester
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build dependencies
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          sudo apt-get update -qq
          sudo apt-get install -y glslc spirv-headers ninja-build
      - name: Check Kotlin and Android lint before native compilation
        working-directory: gpu-tester
        run: |
          base64 -d preview.keystore.b64 > preview.keystore
          gradle --no-daemon :app:compileReleaseKotlin :app:lintRelease
      - name: Build four isolated native backends
        run: bash gpu-tester/tools/build-native.sh
      - name: Assemble tester
        working-directory: gpu-tester
        run: |
          base64 -d preview.keystore.b64 > preview.keystore
          gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify APK
        run: |
          APK=gpu-tester/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/permissions
          if grep -q android.permission.INTERNET /tmp/permissions; then exit 1; fi
          for backend in cpu opencl opencl_generic vulkan; do unzip -l "$APK" | grep "lib/arm64-v8a/libprobe_$backend.so"; done
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/libOpenCL.so'; then exit 1; fi
          cp "$APK" UKMLA-GPU-Tester-v0.1.1-arm64.apk
          sha256sum UKMLA-GPU-Tester-v0.1.1-arm64.apk > GPU-Tester-SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify UI survives worker termination
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: cd gpu-tester && gradle --no-daemon -PtestNoNative :app:connectedDebugAndroidTest
      - name: Publish separate tester download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=gpu-tester-v0.1.1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'UKMLA GPU Tester 0.1.1' --notes-file gpu-tester/README.md
          fi
          gh release upload "$TAG" UKMLA-GPU-Tester-v0.1.1-arm64.apk GPU-Tester-SHA256SUMS.txt --clobber
